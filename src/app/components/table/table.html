<table class="table table-striped">
  <thead>
    <tr>
      <!-- <th *ngFor="let col of columns">{{ col | titlecase }}</th> -->
       @for(item of columns;track $index){
      <th>{{ item | titlecase }}</th>
       }
    </tr>
  </thead>
  <tbody>
    @for(row of data;track $index){
      <tr>
        @for(col of columns;track $index){
        <td >{{ row[col] }}</td>
        }
      </tr>
    }
  </tbody>
</table>
