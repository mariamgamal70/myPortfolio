<table class="table table-striped">
  <thead>
    <tr>
      <!-- Iterate over the 'columns' input to create headers -->
      @for(item of columns; track $index) {
      <th>{{ item | titlecase }}</th>
      }
      <!-- Static header for the actions column -->
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <!-- Iterate over the 'data' input to create rows -->
    @for(row of data; track $index) {
    <tr>
      <!-- Iterate over the 'columns' again to display the data for each cell -->
      @for(col of columns; track $index) {
      <td>{{ row[col] }}</td>
      }

      <!-- Actions Column -->
      <td>
        <div class="btn-group" role="group" aria-label="Table actions">
          <!-- Edit Button -->
          <button class="btn btn-sm btn-primary" type="button" (click)="onAction('edit', row)">
            Edit
          </button>
          <!-- Delete Button -->
          <button class="btn btn-sm btn-danger" type="button" (click)="onAction('delete', row)">
            Delete
          </button>
        </div>
      </td>
    </tr>
    }
  </tbody>
</table>

<!-- A message to display if there is no data -->
@if (data.length === 0) {
<p>No records found.</p>
}
