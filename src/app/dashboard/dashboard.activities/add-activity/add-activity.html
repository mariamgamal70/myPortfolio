<form [formGroup]="activityForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="place">Place</label>
    <input id="place" type="text" formControlName="place" placeholder="Enter place" />
    <div *ngIf="activityForm.get('place')?.invalid && activityForm.get('place')?.touched" style="color:crimson">
      Place is required.
    </div>
  </div>

  <div>
    <label for="position">Position</label>
    <input id="position" type="text" formControlName="position" placeholder="Enter position" />
    <div *ngIf="activityForm.get('position')?.invalid && activityForm.get('position')?.touched" style="color:crimson">
      Position is required.
    </div>
  </div>

  <div formArrayName="description">
    <label>Description</label>
      <div *ngFor="let ctrl of descriptionArray.controls ; let i = index">
      <textarea [formControlName]="i" rows="2" placeholder="Description {{ i + 1 }}"></textarea>
      <button type="button" (click)="removeDescription(i)">Remove</button>
      <div *ngIf="ctrl?.invalid && ctrl?.touched" style="color:crimson">
        Description is required.
      </div>
    </div>

    <div>
      <button type="button" (click)="addDescription()">Add description</button>
    </div>
  </div>

  <div>
    <label for="date">Date</label>
    <input id="date" type="date" formControlName="date" />
    <div *ngIf="activityForm.get('date')?.invalid && activityForm.get('date')?.touched" style="color:crimson">
      Date is required.
    </div>
  </div>

  <div>
    <button type="submit" [disabled]="activityForm.invalid">Save Activity</button>
  </div>
</form>
