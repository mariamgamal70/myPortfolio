<form [formGroup]="awardForm" (ngSubmit)="onSubmit()" class="award-form" novalidate>
  <div class="form-group">
    <label for="title">Title *</label>
    <input id="title" type="text" formControlName="title" class="form-control" />
    <div class="invalid" *ngIf="awardForm.get('title')?.touched && awardForm.get('title')?.invalid">
      Title is required.
    </div>
  </div>

  <div class="form-group">
    <label for="issuer">Issuer *</label>
    <input id="issuer" type="text" formControlName="issuer" class="form-control" />
    <div class="invalid" *ngIf="awardForm.get('issuer')?.touched && awardForm.get('issuer')?.invalid">
      Issuer is required.
    </div>
  </div>

  <div class="form-group">
    <label for="date">Date *</label>
    <input id="date" type="date" formControlName="date" class="form-control" />
    <div class="invalid" *ngIf="awardForm.get('date')?.touched && awardForm.get('date')?.invalid">
      Date is required.
    </div>
  </div>

  <div class="form-group">
    <label for="description">Description</label>
    <div formArrayName="description">
      <div *ngFor="let ctrl of awardForm.get('description')?.controls; let i = index" class="description-item">
        <textarea [formControlName]="i" class="form-control" rows="2" placeholder="Enter description {{ i + 1 }}"></textarea>
        <button type="button" class="btn btn-link text-danger" (click)="removeDescription(i)">Remove</button>
        <div class="invalid" *ngIf="awardForm.get(['description', i])?.touched && awardForm.get(['description', i])?.invalid">
          Description is required.
        </div>
      </div>

      <button type="button" class="btn btn-secondary mt-2" (click)="addDescription()">Add description</button>
    </div>
    <div class="invalid" *ngIf="awardForm.get('description')?.touched && awardForm.get('description')?.invalid">
      Description is required.
    </div>
  </div>

  <div class="form-actions">
    <button type="submit" [disabled]="awardForm.invalid" class="btn btn-primary">Save Award</button>
  </div>
</form>
