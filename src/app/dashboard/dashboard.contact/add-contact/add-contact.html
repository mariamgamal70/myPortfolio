<!-- add-contact.component.html -->
<form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
  <div>
    <label for="name">Name</label>
    <input id="name" type="text" formControlName="name" class="form-control"   />
    <div *ngIf="contactForm.get('name')?.touched && contactForm.get('name')?.invalid">
      <small *ngIf="contactForm.get('name')?.errors?.['required']">Name is required.</small>
    </div>
  </div>

  <div>
    <label for="image">Image URL</label>
    <input id="image" type="text" formControlName="image" class="form-control" type="file"/>
    <div *ngIf="contactForm.get('image')?.touched && contactForm.get('image')?.invalid">
      <small *ngIf="contactForm.get('image')?.errors?.['required']">Image URL is required.</small>
    </div>
  </div>

  <div>
    <label for="link">Link</label>
    <input id="link" type="text" formControlName="link" class="form-control" />
    <div *ngIf="contactForm.get('link')?.touched && contactForm.get('link')?.invalid">
      <small *ngIf="contactForm.get('link')?.errors?.['required']">Link is required.</small>
    </div>
  </div>

  <button type="submit" [disabled]="contactForm.invalid" class="btn btn-primary">Add Contact</button>
</form>
