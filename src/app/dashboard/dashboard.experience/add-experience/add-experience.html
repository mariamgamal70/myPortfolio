<form [formGroup]="experienceForm" (ngSubmit)="onSubmit()" class="experience-form" novalidate>
  <div class="form-group">
    <label for="company">Company *</label>
    <input id="company" type="text" formControlName="company" class="form-control" required />
    <div class="text-danger" *ngIf="experienceForm.get('company')?.touched && experienceForm.get('company')?.invalid">
      Company is required.
    </div>
  </div>

  <div class="form-group">
    <label for="position">Position *</label>
    <input id="position" type="text" formControlName="position" class="form-control" required />
    <div class="text-danger" *ngIf="experienceForm.get('position')?.touched && experienceForm.get('position')?.invalid">
      Position is required.
    </div>
  </div>

  <div class="form-group">
    <label for="location">Location</label>
    <input id="location" type="text" formControlName="location" class="form-control" />
  </div>

  <div class="form-row">
    <div class="form-group col">
      <label for="startDate">Start Date *</label>
      <input id="startDate" type="date" formControlName="startDate" class="form-control" required />
      <div class="text-danger" *ngIf="experienceForm.get('startDate')?.touched && experienceForm.get('startDate')?.invalid">
        Start date is required.
      </div>
    </div>

    <div class="form-group col">
      <label for="endDate">End Date</label>
      <input
        id="endDate"
        type="date"
        formControlName="endDate"
        class="form-control"
        [disabled]="experienceForm.get('status')?.value === 'Present'"
      />
      <div class="text-muted" *ngIf="experienceForm.get('status')?.value === 'Present'">
        Disabled because status is "Present".
      </div>
    </div>
  </div>

  <div class="form-group">
    <label>Responsibilities</label>
    <div formArrayName="responsibilities">
      <div *ngFor="let ctrl of experienceForm.get('responsibilities')?.controls; let i = index" class="d-flex mb-2">
        <input [formControlName]="i" type="text" class="form-control" placeholder="Responsibility" />
        <button type="button" class="btn btn-outline-danger btn-sm ml-2" (click)="removeResponsibility(i)">Remove</button>
      </div>
    </div>
    <button type="button" class="btn btn-outline-primary btn-sm mt-2" (click)="addResponsibility()">Add responsibility</button>
  </div>

  <div class="form-group">
    <label>Status</label>
    <div class="d-flex">
      <div class="form-check mr-3">
        <input id="statusPast" class="form-check-input" type="radio" formControlName="status" value="Past" />
        <label class="form-check-label" for="statusPast">Past</label>
      </div>
      <div class="form-check">
        <input id="statusPresent" class="form-check-input" type="radio" formControlName="status" value="Present" />
        <label class="form-check-label" for="statusPresent">Present</label>
      </div>
    </div>
  </div>

  <div class="form-actions mt-3">
    <button type="submit" class="btn btn-primary" [disabled]="experienceForm.invalid">Save</button>
  </div>
</form>
